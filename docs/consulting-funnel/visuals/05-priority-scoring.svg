<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d"><title id="t">Seven-factor scoring model</title><desc id="d">Skill fit 25, compensation 20, freshness 15, buyer credibility 15, competition 10, scope 10, timezone 5.</desc><rect width="940" height="586" fill="#FFFFFF"/><text x="32" y="47" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243D" text-anchor="start">Transparent priority score / 100</text><text x="32" y="75" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Initial heuristic, NOT a probability of winning a contract</text><text x="40" y="131" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#26354A" text-anchor="start">Verified skill alignment</text><rect x="356" y="115" width="470" height="24" rx="7" fill="#ECF1F7" stroke="none" stroke-width="1"/><rect x="356" y="115" width="470.0" height="24" rx="7" fill="#087E78" stroke="none" stroke-width="1"/><text x="852" y="133" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">25 pts</text><text x="40" y="182" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#26354A" text-anchor="start">Compensation vs. effort</text><rect x="356" y="166" width="470" height="24" rx="7" fill="#ECF1F7" stroke="none" stroke-width="1"/><rect x="356" y="166" width="376.0" height="24" rx="7" fill="#3B6FA1" stroke="none" stroke-width="1"/><text x="852" y="184" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">20 pts</text><text x="40" y="233" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#26354A" text-anchor="start">Posting freshness</text><rect x="356" y="217" width="470" height="24" rx="7" fill="#ECF1F7" stroke="none" stroke-width="1"/><rect x="356" y="217" width="282.0" height="24" rx="7" fill="#84619C" stroke="none" stroke-width="1"/><text x="852" y="235" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">15 pts</text><text x="40" y="284" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#26354A" text-anchor="start">Buyer credibility</text><rect x="356" y="268" width="470" height="24" rx="7" fill="#ECF1F7" stroke="none" stroke-width="1"/><rect x="356" y="268" width="282.0" height="24" rx="7" fill="#3B6FA1" stroke="none" stroke-width="1"/><text x="852" y="286" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">15 pts</text><text x="40" y="335" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#26354A" text-anchor="start">Competition</text><rect x="356" y="319" width="470" height="24" rx="7" fill="#ECF1F7" stroke="none" stroke-width="1"/><rect x="356" y="319" width="188.0" height="24" rx="7" fill="#BD8138" stroke="none" stroke-width="1"/><text x="852" y="337" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">10 pts</text><text x="40" y="386" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#26354A" text-anchor="start">Scope clarity</text><rect x="356" y="370" width="470" height="24" rx="7" fill="#ECF1F7" stroke="none" stroke-width="1"/><rect x="356" y="370" width="188.0" height="24" rx="7" fill="#BD8138" stroke="none" stroke-width="1"/><text x="852" y="388" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">10 pts</text><text x="40" y="437" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#26354A" text-anchor="start">Timezone/location</text><rect x="356" y="421" width="470" height="24" rx="7" fill="#ECF1F7" stroke="none" stroke-width="1"/><rect x="356" y="421" width="94.0" height="24" rx="7" fill="#61728B" stroke="none" stroke-width="1"/><text x="852" y="439" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">5 pts</text><rect x="32" y="492" width="870" height="68" rx="12" fill="#FFF4EB" stroke="#F1D9C5" stroke-width="1"/><text x="48" y="520" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">Hard exclusions:</text><text x="48" y="545" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#A94B4B" text-anchor="start">Unpaid/spec work • unclear buyers • implausible scope • unverified skills • no legitimate contact path</text></svg>