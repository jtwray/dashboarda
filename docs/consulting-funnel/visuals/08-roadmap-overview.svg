<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 590" width="1020" height="590" role="img" aria-labelledby="t d"><title id="t">Roadmap phases</title><desc id="d">Archive, queue, alerts, outcomes, compliant automation, and reusable scaffold.</desc><rect width="1020" height="590" fill="#FFFFFF"/><text x="32" y="47" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243D" text-anchor="start">Phased implementation · review gates</text><text x="32" y="75" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Do the simplest valuable thing first; do not automate bidding before data quality</text><rect x="32" y="100" width="956" height="66" rx="9" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="46" y="112" width="44" height="43" rx="9" fill="#087E78" stroke="none" stroke-width="1"/><text x="68" y="139" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S0</text><text x="106" y="127" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Archive &amp; evidence</text><text x="106" y="148" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Portable visuals and canonical roadmap</text><rect x="872" y="115" width="97" height="31" rx="14" fill="#E5EDF5" stroke="none" stroke-width="1"/><text x="920" y="135" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">Prepared</text><rect x="32" y="177" width="956" height="66" rx="9" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="46" y="189" width="44" height="43" rx="9" fill="#087E78" stroke="none" stroke-width="1"/><text x="68" y="216" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S1</text><text x="106" y="204" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Persist the queue</text><text x="106" y="225" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Schema · ingest · dedup · sort · statuses</text><rect x="872" y="192" width="97" height="31" rx="14" fill="#E5EDF5" stroke="none" stroke-width="1"/><text x="920" y="212" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">Next</text><rect x="32" y="254" width="956" height="66" rx="9" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="46" y="266" width="44" height="43" rx="9" fill="#3B6FA1" stroke="none" stroke-width="1"/><text x="68" y="293" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S2</text><text x="106" y="281" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Alerts &amp; proposal packets</text><text x="106" y="302" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Compliant fresh discovery · evidence drafts</text><rect x="872" y="269" width="97" height="31" rx="14" fill="#E5EDF5" stroke="none" stroke-width="1"/><text x="920" y="289" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">Later</text><rect x="32" y="331" width="956" height="66" rx="9" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="46" y="343" width="44" height="43" rx="9" fill="#3B6FA1" stroke="none" stroke-width="1"/><text x="68" y="370" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S3</text><text x="106" y="358" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Outcomes &amp; experiments</text><text x="106" y="379" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Replies · wins · timing and source analysis</text><rect x="872" y="346" width="97" height="31" rx="14" fill="#E5EDF5" stroke="none" stroke-width="1"/><text x="920" y="366" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">Later</text><rect x="32" y="408" width="956" height="66" rx="9" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="46" y="420" width="44" height="43" rx="9" fill="#84619C" stroke="none" stroke-width="1"/><text x="68" y="447" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S4</text><text x="106" y="435" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Permitted automation</text><text x="106" y="456" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Only after safety, quality and approval gates</text><rect x="872" y="423" width="97" height="31" rx="14" fill="#E5EDF5" stroke="none" stroke-width="1"/><text x="920" y="443" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">Future</text><rect x="32" y="485" width="956" height="66" rx="9" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="46" y="497" width="44" height="43" rx="9" fill="#84619C" stroke="none" stroke-width="1"/><text x="68" y="524" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S5</text><text x="106" y="512" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Reusable scaffold</text><text x="106" y="533" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Dashboarda app-instantiation / blueprint</text><rect x="872" y="500" width="97" height="31" rx="14" fill="#E5EDF5" stroke="none" stroke-width="1"/><text x