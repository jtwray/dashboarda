<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 596" width="880" height="596" role="img" aria-labelledby="t d"><title id="t">Current funnel friction</title><desc id="d">Five problems: scrolling, duplicates, inconsistent scores, untracked conversion, no feedback loop.</desc><rect width="880" height="596" fill="#FFFFFF"/><text x="32" y="47" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243D" text-anchor="start">Where the current gig radar leaks</text><text x="32" y="75" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Five observed problems · October 23, 2026</text><rect x="32" y="103" width="816" height="65" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="43" y="115" width="42" height="42" rx="10" fill="#087E78" stroke="none" stroke-width="1"/><text x="64" y="142" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="100" y="128" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243D" text-anchor="start">Reading instead of acting</text><text x="100" y="151" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Scrolling and mentally comparing listings consumes application time.</text><rect x="32" y="182" width="816" height="65" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="43" y="194" width="42" height="42" rx="10" fill="#3B6FA1" stroke="none" stroke-width="1"/><text x="64" y="221" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="100" y="207" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243D" text-anchor="start">Duplicates and weak freshness</text><text x="100" y="230" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Discovery timestamps are repeatedly mistaken for original posting dates.</text><rect x="32" y="261" width="816" height="65" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="43" y="273" width="42" height="42" rx="10" fill="#BD8138" stroke="none" stroke-width="1"/><text x="64" y="300" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="100" y="286" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243D" text-anchor="start">Inconsistent ranking</text><text x="100" y="309" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Pay, competition, fit, effort and credibility are not scored together.</text><rect x="32" y="340" width="816" height="65" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="43" y="352" width="42" height="42" rx="10" fill="#84619C" stroke="none" stroke-width="1"/><text x="64" y="379" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text><text x="100" y="365" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243D" text-anchor="start">Untracked conversion</text><text x="100" y="388" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">No authoritative application-to-reply-to-contract pipeline.</text><rect x="32" y="419" width="816" height="65" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="43" y="431" width="42" height="42" rx="10" fill="#A94B4B" stroke="none" stroke-width="1"/><text x="64" y="458" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">05</text><text x="100" y="444" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243D" text-anchor="start">No feedback loop</text><text x="100" y="467" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">We cannot yet learn what sources, timings or bids actually win.</text><rect x="32" y="510" width="816" height="62" rx="12" fill="#E8F4F2" stroke="#B6D9D2" stroke-width="1"/><text x="440" y="534" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#087E78" text-anchor="middle">Goal: paid contracts won per hour of acquisition effort</text><text x="440" y="555" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#26354A" text-anchor="middle">Not number of listings shown.</text></svg>