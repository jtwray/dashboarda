<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 487" width="980" height="487" role="img" aria-labelledby="t d"><title id="t">Four success metrics</title><desc id="d">Applications, response rate, win rate and net revenue per hour.</desc><rect width="980" height="487" fill="#FFFFFF"/><text x="32" y="47" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243D" text-anchor="start">Measure outcomes, not feed volume</text><text x="32" y="75" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">A weekly scorecard for learning which gigs become paid work</text><rect x="32" y="105" width="450" height="138" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><text x="51" y="136" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#087E78" text-anchor="start">LEADING INDICATOR</text><text x="51" y="177" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#17243D" text-anchor="start">Applications</text><text x="51" y="210" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">qualified proposals sent / week</text><rect x="501" y="105" width="450" height="138" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><text x="520" y="136" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#087E78" text-anchor="start">EARLY CONVERSION</text><text x="520" y="177" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#17243D" text-anchor="start">Response rate</text><text x="520" y="210" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">buyer replies / delivered proposals</text><rect x="32" y="265" width="450" height="138" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><text x="51" y="296" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#087E78" text-anchor="start">BUSINESS OUTCOME</text><text x="51" y="337" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#17243D" text-anchor="start">Win rate</text><text x="51" y="370" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">contracts won / submitted proposals</text><rect x="501" y="265" width="450" height="138" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><text x="520" y="296" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#087E78" text-anchor="start">ULTIMATE OUTCOME</text><text x="520" y="337" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#17243D" text-anchor="start">Net $ per hour</text><text x="520" y="370" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">collected revenue minus fees / total hours</text><text x="32" y="460" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Also track: proposal latency · source · connects/fees · proposed rate · actual effort · repeat client.</text></svg>