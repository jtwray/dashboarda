<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 422" width="920" height="422" role="img" aria-labelledby="t d"><title id="t">Candidate monitoring windows</title><desc id="d">Morning, US daytime and late evening windows. These are hypotheses, not proven optimal times.</desc><rect width="920" height="422" fill="#FFFFFF"/><text x="32" y="47" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243D" text-anchor="start">Timing is an experiment, not a magic hour</text><text x="32" y="75" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Use original posting timestamp, observed timestamp and application timestamp separately</text><rect x="32" y="108" width="278" height="136" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="46" y="123" width="250" height="39" rx="8" fill="#3B6FA1" stroke="none" stroke-width="1"/><text x="171" y="150" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6–9 AM ET</text><text x="48" y="183" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Morning backlog</text><text x="48" y="207" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Review overnight postings</text><rect x="328" y="108" width="278" height="136" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="342" y="123" width="250" height="39" rx="8" fill="#087E78" stroke="none" stroke-width="1"/><text x="467" y="150" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">9 AM–4 PM ET</text><text x="344" y="183" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">US daytime</text><text x="344" y="207" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Monitor live posting volume</text><rect x="624" y="108" width="278" height="136" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="638" y="123" width="250" height="39" rx="8" fill="#84619C" stroke="none" stroke-width="1"/><text x="763" y="150" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7–11 PM ET</text><text x="640" y="183" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243D" text-anchor="start">Late evening</text><text x="640" y="207" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Test West Coast and overseas</text><text x="640" y="226" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">windows</text><rect x="32" y="267" width="870" height="84" rx="12" fill="#F3F8FB" stroke="#DCE9F1" stroke-width="1"/><text x="48" y="294" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">Capture:</text><text x="135" y="294" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#26354A" text-anchor="start">postedAt (verified or unknown) · firstSeenAt · appliedAt · buyerTimezone (estimated)</text><text x="48" y="321" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17243D" text-anchor="start">Compare:</text><text x="135" y="321" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#26354A" text-anchor="start">response rate by posting-to-proposal latency after enough observations</text><text x="32" y="394" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">Hypothesis only: early-to-posting and well-targeted may outperform simply applying at night.</text></svg>