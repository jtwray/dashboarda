<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" width="920" height="570" role="img" aria-labelledby="t d"><title id="t">Three-stage automation ladder</title><desc id="d">Start with drafting, then preparation, then only select permitted submission with approval and rules.</desc><rect width="920" height="570" fill="#FFFFFF"/><text x="32" y="47" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17243D" text-anchor="start">Automation ladder with human approval</text><text x="32" y="75" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#61728B" text-anchor="start">Increasing autonomy requires evidence, consent and platform compliance</text><rect x="32" y="108" width="856" height="100" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="48" y="127" width="55" height="55" rx="12" fill="#087E78" stroke="none" stroke-width="1"/><text x="75" y="164" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124" y="140" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17243D" text-anchor="start">Auto-discover and draft</text><text x="124" y="169" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">Sources → verify → score → tailored packet</text><rect x="728" y="130" width="140" height="35" rx="15" fill="#E7EEF5" stroke="none" stroke-width="1"/><text x="798" y="153" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">Now</text><rect x="32" y="223" width="856" height="100" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="48" y="242" width="55" height="55" rx="12" fill="#3B6FA1" stroke="none" stroke-width="1"/><text x="75" y="279" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="124" y="255" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17243D" text-anchor="start">One-tap application preparation</text><text x="124" y="284" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">Evidence, price, scope, proposal, deep link</text><rect x="728" y="245" width="140" height="35" rx="15" fill="#E7EEF5" stroke="none" stroke-width="1"/><text x="798" y="268" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">After quality gate</text><rect x="32" y="338" width="856" height="100" rx="12" fill="#F4F7FA" stroke="#E3EAF2" stroke-width="1"/><rect x="48" y="357" width="55" height="55" rx="12" fill="#84619C" stroke="none" stroke-width="1"/><text x="75" y="394" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="124" y="370" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17243D" text-anchor="start">Selective permitted submission</text><text x="124" y="399" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#61728B" text-anchor="start">Explicit opt-in, channel allowlist, spend caps, audit log</text><rect x="728" y="360" width="140" height="35" rx="15" fill="#E7EEF5" stroke="none" stroke-width="1"/><text x="798" y="383" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3B6FA1" text-anchor="middle">Future only</text><rect x="32" y="473" width="856" height="72" rx="12" fill="#FFF4EB" stroke="#F0DBC9" stroke-width="1"/><text x="48" y="500" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#17243D" text-anchor="start">Always prohibited by policy in this plan:</text><text x="48" y="524" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#A94B4B" text-anchor="start">fabricated claims • spam • unauthorized scraping/submission • unapproved spend or contract acceptance</text></svg>