<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Board</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;gap:16px}h1{margin:0 0 6px}p{margin:0;color:#657086}.pill,.status{border:1px solid #dde2ea;border-radius:999px;background:#fff;padding:6px 9px;font-size:.8rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e5e8ef;border-radius:14px}.stat{padding:15px}.stat b{display:block;font-size:1.45rem}.toolbar{display:flex;gap:10px;padding:12px}input,button,select{font:inherit;border:1px solid #dce1ea;border-radius:9px;padding:9px 11px;background:#fff}input{flex:1}.primary{background:#172033;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-top:1px solid #edf0f4;text-align:left;font-size:.9rem}th{font-size:.72rem;text-transform:uppercase;color:#7d8798}.table{overflow-x:auto}.empty{padding:40px;text-align:center;color:#7d8798}a{color:#2457d6}.muted,footer{color:#8a93a4;font-size:.78rem}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}th,td{white-space:nowrap}}.tasks{padding:4px 12px 14px}.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid #edf0f4}.task.done .title{text-decoration:line-through;color:#8b94a5}.who{font-size:.75rem;background:#f6f7fb;border-radius:999px;padding:4px 8px}.delete{border:0;color:#944;background:transparent}.check{width:20px;height:20px}</style></head><body><main class="shell"><header><div><h1>Home Board</h1><p>Shared household chore list.</p></div><span class="pill">Shared</span></header><section class="stats"><div class="card stat"><span class="muted">Open</span><b id="openCount">0</b></div><div class="card stat"><span class="muted">Done</span><b id="doneCount">0</b></div></section><section class="card"><div class="toolbar"><input id="newTask" placeholder="Add a household chore…"><select id="who"><option>Either</option><option>Tucker</option><option>Wife</option><option>Together</option></select><button class="primary" id="add">Add</button></div><div class="tasks" id="tasks"></div></section></main><script>let s={items:[]},pin=localStorage.getItem("homePin")||"";const e=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function api(method="GET",body){if(!pin)pin=prompt("Shared Home Board PIN")||"";localStorage.setItem("homePin",pin);const r=await fetch("/api/state",{method,headers:{"content-type":"application/json","x-board-pin":pin},body:body?JSON.stringify(body):undefined});if(r.status===401){localStorage.removeItem("homePin");pin="";alert("Wrong PIN");throw Error("unauthorized")}return r.json()}async function load(){try{s=await api()}catch{}render()}function render(){const a=s.items||[];openCount.textContent=a.filter(x=>!x.done).length;doneCount.textContent=a.filter(x=>x.done).length;tasks.innerHTML=a.map(x=>`<div class="task ${x.done?"done":""}"><input class="check" type="checkbox" ${x.done?"checked":""} data-t="${x.id}"><div class="title">${e(x.title)}</div><span class="who">${e(x.who)}</span><button class="delete" data-d="${x.id}">Delete</button></div>`).join("")||'<div class="empty">No chores yet.</div>';document.querySelectorAll("[data-t]").forEach(n=>n.onchange=()=>save(a.map(x=>x.id===n.dataset.t?{...x,done:n.checked}:x)));document.querySelectorAll("[data-d]").forEach(n=>n.onclick=()=>save(a.filter(x=>x.id!==n.dataset.d)))}async function save(items){s=await api("POST",{items});render()}add.onclick=async()=>{const title=newTask.value.trim();if(!title)return;await save([...(s.items||[]),{id:crypto.randomUUID(),title,who:who.value,done:false}]);newTask.value=""};newTask.onkeydown=x=>{if(x.key==="Enter")add.click()};load();</script></body></html>
